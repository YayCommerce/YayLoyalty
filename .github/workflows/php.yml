name: PHP

# Runs only when product PHP changes. Docs-only and JS-only changes skip it.
on:
  pull_request:
    branches: [dev/edd, main]
    paths:
      - 'includes/**'
      - 'yayloyalty.php'
      - 'YayLoyaltyPluginAdapter.php'
      - 'index.php'
      - '.github/workflows/php.yml'
  push:
    branches: [dev/edd, main]
    paths:
      - 'includes/**'
      - 'yayloyalty.php'
      - 'YayLoyaltyPluginAdapter.php'
      - 'index.php'
      - '.github/workflows/php.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none
          coverage: none

      # Product PHP must run on PHP 7.4 (CLAUDE.md hard rule 4).
      - name: Lint product PHP
        run: |
          find includes yayloyalty.php YayLoyaltyPluginAdapter.php index.php \
            -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log 2>&1 || {
              grep -v '^No syntax errors' lint.log
              exit 1
            }
          echo "$(wc -l < lint.log) files OK"
